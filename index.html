<title>DECODER V11.3</title>
<style>
:root{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#ece9e2;color:#171717
}
*{box-sizing:border-box}
body{margin:0}
header{background:#151515;color:#fff;padding:12px 16px}
header .inner{max-width:820px;margin:auto;display:flex;align-items:center;gap:9px}
header img{width:22px;height:22px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
h1{font-size:1.3rem;margin:0}.sub{font-size:.82rem;opacity:.78}
main{max-width:820px;margin:auto;padding:14px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 16px #0002}
button{
  width:100%;border:0;border-radius:15px;background:#151515;color:#fff;
  padding:20px 18px;font-size:1.22rem;font-weight:800;cursor:pointer
}
button.secondary{margin-top:12px;background:#ddd;color:#111}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
input[type=file]{position:absolute;left:-9999px;width:1px;height:1px;opacity:.01}
canvas,#solution{
  display:block;width:100%;height:auto;border-radius:14px;margin-top:14px;
  object-fit:contain;background:#fff
}
#result{font-weight:800;font-size:1.14rem;white-space:pre-line}
.ok{color:#08752d}.bad{color:#a31717}
.small{color:#555;font-size:.9rem;white-space:pre-line;margin-top:8px}
#diagnostics{
  margin-top:12px;padding:12px;border-radius:12px;background:#f4f4f4;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.82rem;
  white-space:pre-line
}
.status-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.badge{display:inline-block;border-radius:999px;padding:5px 9px;background:#eee;font-size:.82rem}
</style>

const $ = selector => document.querySelector(selector);

const ui = {
  photoInput: $("#photoInput"),
  takePhotoBtn: $("#takePhotoBtn"),
  decodeBtn: $("#decodeBtn"),
  canvas: $("#photoCanvas"),
  result: $("#result"),
  details: $("#details"),
  diagnostics: $("#diagnostics"),
  solution: $("#solution"),
  cvBadge: $("#cvBadge")
};

ui.solution.addEventListener("load",()=>{
  ui.solution.classList.remove("hidden");
  ui.details.textContent += "\nOplossing geladen.";
});
ui.solution.addEventListener("error",()=>{
  ui.solution.classList.add("hidden");
  setStatus("Correct gedecodeerd, maar de oplossing kon niet worden getoond.","bad");
  ui.details.textContent += "\nDe ingebouwde oplossingsafbeelding kon niet worden geladen.";
});

let cvReady = false;
let photoLoaded = false;

function setStatus(message, kind=""){
  ui.result.className = kind;
  ui.result.textContent = message;
}
function setDiagnostic(lines){
  ui.diagnostics.textContent = Array.isArray(lines) ? lines.join("\n") : lines;
}

function initialiseOpenCV(){
  const ready = () => {
    if (cvReady) return;
    cvReady = true;
    ui.cvBadge.textContent = "Beeldverwerking klaar";
    ui.cvBadge.style.background = "#d8f2df";
    setStatus("Decoder klaar.");
  };

  if (!window.cv) {
    setTimeout(initialiseOpenCV, 250);
    return;
  }

  if (typeof window.cv.then === "function") {
    window.cv.then(() => ready()).catch(error => {
      console.error(error);
      ui.cvBadge.textContent = "Beeldverwerking niet geladen";
      setStatus("OpenCV kon niet worden geladen. Controleer de internetverbinding.", "bad");
    });
    return;
  }

  if (window.cv.Mat) {
    ready();
    return;
  }

  window.cv.onRuntimeInitialized = ready;
}
initialiseOpenCV();

ui.takePhotoBtn.addEventListener("click", () => {
  ui.photoInput.value = "";
  ui.photoInput.click();
});

ui.photoInput.addEventListener("change", async event => {
  const file = event.target.files?.[0];
  if (!file) return;

  photoLoaded = false;
  ui.decodeBtn.classList.add("hidden");
  ui.solution.classList.add("hidden");
  setStatus("Foto wordt geladen…");
  setDiagnostic(["Foto ontvangen", "Foto openen…"]);

  try {
    let source;
    if ("createImageBitmap" in window) {
      source = await createImageBitmap(file);
    } else {
      source = await new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Foto kon niet worden geopend"));
        };
        img.src = url;
      });
    }

    const width = source.width || source.naturalWidth;
    const height = source.height || source.naturalHeight;
    const scale = Math.min(1, 1800 / width, 2400 / height);

    ui.canvas.width = Math.max(1, Math.round(width * scale));
    ui.canvas.height = Math.max(1, Math.round(height * scale));

    const ctx = ui.canvas.getContext("2d", {willReadFrequently:true});
    ctx.clearRect(0, 0, ui.canvas.width, ui.canvas.height);
    ctx.drawImage(source, 0, 0, ui.canvas.width, ui.canvas.height);
    if (source.close) source.close();

    ui.canvas.classList.remove("hidden");
    ui.decodeBtn.classList.remove("hidden");
    photoLoaded = true;

    setStatus("Foto klaar. Druk onder de foto op ‘Decodeer foto’.");
    setDiagnostic([
      "✓ Foto geladen",
      `✓ Resolutie: ${ui.canvas.width} × ${ui.canvas.height}`,
      cvReady ? "✓ Beeldverwerking klaar" : "… Beeldverwerking wordt geladen"
    ]);
  } catch (error) {
    console.error(error);
    setStatus("De foto kon niet worden geopend.", "bad");
    setDiagnostic("✗ " + (error.message || error));
  }
});

function orderPoints(points){
  const sum = p => p.x + p.y;
  const diff = p => p.x - p.y;
  return [
    points.reduce((a,p)=>sum(p)<sum(a)?p:a),
    points.reduce((a,p)=>diff(p)>diff(a)?p:a),
    points.reduce((a,p)=>sum(p)>sum(a)?p:a),
    points.reduce((a,p)=>diff(p)<diff(a)?p:a)
  ];
}

function collectMarkerCandidates(binary,src){
  const contours=new cv.MatVector();
  const hierarchy=new cv.Mat();
  const candidates=[];
  try{
    cv.findContours(binary,contours,hierarchy,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
    const imageArea=src.rows*src.cols;

    for(let i=0;i<contours.size();i++){
      const contour=contours.get(i);
      const area=cv.contourArea(contour);
      const rect=cv.boundingRect(contour);
      const ratio=rect.width/Math.max(1,rect.height);
      const extent=area/Math.max(1,rect.width*rect.height);
      const cx=rect.x+rect.width/2;
      const cy=rect.y+rect.height/2;
      const inCorner=
        (cx<src.cols*.38||cx>src.cols*.62)&&
        (cy<src.rows*.38||cy>src.rows*.62);

      if(
        area>imageArea*.00012 &&
        area<imageArea*.075 &&
        ratio>.42 && ratio<2.25 &&
        extent>.24 &&
        inCorner
      ){
        const squareQuality=1-Math.min(1,Math.abs(Math.log(ratio)));
        candidates.push({
          x:cx,y:cy,
          score:area*(.45+extent)*(.45+squareQuality),
          rect
        });
      }
      contour.delete();
    }
  }finally{
    contours.delete();
    hierarchy.delete();
  }
  return candidates;
}

function selectOnePerCorner(candidates,src){
  const zones=[
    p=>p.x<src.cols/2&&p.y<src.rows/2,
    p=>p.x>=src.cols/2&&p.y<src.rows/2,
    p=>p.x>=src.cols/2&&p.y>=src.rows/2,
    p=>p.x<src.cols/2&&p.y>=src.rows/2
  ];
  const selected=[];
  for(const zone of zones){
    const matches=candidates.filter(zone).sort((a,b)=>b.score-a.score);
    if(!matches.length)return null;
    selected.push(matches[0]);
  }
  return orderPoints(selected);
}

function findFiducialInCorner(src,corner){
  const specs={
    tl:[0,0,.46,.40],
    tr:[.54,0,.46,.40],
    br:[.54,.60,.46,.40],
    bl:[0,.60,.46,.40]
  };
  const [rx,ry,rw,rh]=specs[corner];
  const x=Math.floor(src.cols*rx);
  const y=Math.floor(src.rows*ry);
  const w=Math.max(1,Math.floor(src.cols*rw));
  const h=Math.max(1,Math.floor(src.rows*rh));

  const roi=src.roi(new cv.Rect(x,y,w,h));
  const gray=new cv.Mat();
  const blur=new cv.Mat();
  const candidates=[];

  try{
    cv.cvtColor(roi,gray,cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);

    for(const mode of ["adaptive",55,75,95,115,135,155]){
      const binary=new cv.Mat();
      const contours=new cv.MatVector();
      const hierarchy=new cv.Mat();

      try{
        if(mode==="adaptive"){
          cv.adaptiveThreshold(
            blur,binary,255,
            cv.ADAPTIVE_THRESH_GAUSSIAN_C,
            cv.THRESH_BINARY_INV,
            41,9
          );
        }else{
          cv.threshold(blur,binary,mode,255,cv.THRESH_BINARY_INV);
        }

        cv.findContours(binary,contours,hierarchy,cv.RETR_TREE,cv.CHAIN_APPROX_SIMPLE);
        const roiArea=w*h;

        for(let i=0;i<contours.size();i++){
          const contour=contours.get(i);
          const area=cv.contourArea(contour);
          const rect=cv.boundingRect(contour);
          const ratio=rect.width/Math.max(1,rect.height);
          const extent=area/Math.max(1,rect.width*rect.height);
          const child=hierarchy.intPtr(0,i)[2];

          if(
            area>roiArea*.001 &&
            area<roiArea*.22 &&
            ratio>.55 && ratio<1.8 &&
            extent>.22
          ){
            let nestedBonus=0;
            if(child!==-1){
              const childContour=contours.get(child);
              const childArea=cv.contourArea(childContour);
              childContour.delete();
              const nestedRatio=childArea/Math.max(1,area);
              if(nestedRatio>.08&&nestedRatio<.85)nestedBonus=1;
            }

            const cx=x+rect.x+rect.width/2;
            const cy=y+rect.y+rect.height/2;
            const localCx=rect.x+rect.width/2;
            const localCy=rect.y+rect.height/2;
            const cornerDistance=
              (corner.includes("r")?w-localCx:localCx)+
              (corner.includes("b")?h-localCy:localCy);
            const squareQuality=1-Math.min(1,Math.abs(Math.log(ratio)));
            const score=
              area*(.35+extent)*(.45+squareQuality)*(1+nestedBonus*.8)/
              (1+cornerDistance/Math.min(w,h));

            candidates.push({x:cx,y:cy,score});
          }
          contour.delete();
        }
      }finally{
        binary.delete();
        contours.delete();
        hierarchy.delete();
      }
    }

    if(!candidates.length)return null;
    candidates.sort((a,b)=>b.score-a.score);
    return candidates[0];
  }finally{
    roi.delete();
    gray.delete();
    blur.delete();
  }
}

function detectRegistrationMarkers(src){
  const points=[
    findFiducialInCorner(src,"tl"),
    findFiducialInCorner(src,"tr"),
    findFiducialInCorner(src,"br"),
    findFiducialInCorner(src,"bl")
  ];
  return points.every(Boolean)?orderPoints(points):null;
}

function warpCard(src, markerPoints){
  const L = CONFIG.layout;
  const ordered = orderPoints(markerPoints);

  const sourcePoints = cv.matFromArray(4,1,cv.CV_32FC2,[
    ordered[0].x,ordered[0].y,
    ordered[1].x,ordered[1].y,
    ordered[2].x,ordered[2].y,
    ordered[3].x,ordered[3].y
  ]);

  const targetPoints = cv.matFromArray(4,1,cv.CV_32FC2,[
    L.markerMargin+L.markerSize/2,L.markerMargin+L.markerSize/2,
    L.width-L.markerMargin-L.markerSize/2,L.markerMargin+L.markerSize/2,
    L.width-L.markerMargin-L.markerSize/2,L.height-L.markerMargin-L.markerSize/2,
    L.markerMargin+L.markerSize/2,L.height-L.markerMargin-L.markerSize/2
  ]);

  const matrix = cv.getPerspectiveTransform(sourcePoints,targetPoints);
  const warped = new cv.Mat();

  cv.warpPerspective(
    src,warped,matrix,new cv.Size(L.width,L.height),
    cv.INTER_LINEAR,cv.BORDER_CONSTANT,new cv.Scalar(255,255,255,255)
  );

  sourcePoints.delete();
  targetPoints.delete();
  matrix.delete();
  return warped;
}

function pixel(mat,x,y){
  const X=Math.max(0,Math.min(mat.cols-1,Math.round(x)));
  const Y=Math.max(0,Math.min(mat.rows-1,Math.round(y)));
  const p=mat.ucharPtr(Y,X);
  return {r:p[0],g:p[1],b:p[2]};
}
function lum(p){return .299*p.r+.587*p.g+.114*p.b}

function meanSquare(mat,cx,cy,half){
  let sum=0,n=0;
  for(let y=cy-half;y<=cy+half;y+=1.5){
    for(let x=cx-half;x<=cx+half;x+=1.5){
      sum+=lum(pixel(mat,x,y)); n++;
    }
  }
  return n?sum/n:255;
}

function detectCardType(warped){
  const L=CONFIG.layout;
  const markerX=L.markerMargin;
  const markerY=L.markerMargin;
  const startX=39;
  const startY=39;
  const module=21;
  const gap=10;

  const positions=[
    [startX,startY],
    [startX+module+gap,startY],
    [startX,startY+module+gap],
    [startX+module+gap,startY+module+gap]
  ];

  const values=positions.map(([x,y])=>{
    const m=meanSquare(
      warped,
      markerX+x+module/2,
      markerY+y+module/2,
      4
    );
    return m<125?1:0;
  });

  let best=null,bestDistance=Infinity;
  for(const [name,group] of Object.entries(CONFIG.game.groups)){
    const bits=group.markerBits;
    let distance=0;
    for(let i=0;i<4;i++)distance+=Math.abs(values[i]-bits[i]);
    if(distance<bestDistance){
      bestDistance=distance;
      best=name;
    }
  }
  return bestDistance<=1?{name:best,values,distance:bestDistance}:null;
}

function bubbleScore(warped,cx,cy,r){
  const inner=[];
  const reference=[];
  const outer=r*1.85;

  for(let dy=-outer;dy<=outer;dy+=2){
    for(let dx=-outer;dx<=outer;dx+=2){
      const distance=Math.hypot(dx,dy);
      const p=pixel(warped,cx+dx,cy+dy);
      if(distance<=r*.72){
        inner.push(p);
      }else if(distance>=r*1.32&&distance<=r*1.78){
        reference.push(p);
      }
    }
  }

  const paperValues=reference.map(lum).sort((a,b)=>a-b);
  const paper=paperValues[Math.floor(paperValues.length*.55)] || 245;

  let ink=0,strong=0;
  for(const p of inner){
    const l=lum(p);
    const max=Math.max(p.r,p.g,p.b);
    const min=Math.min(p.r,p.g,p.b);
    const saturation=max-min;

    const black=l<paper-24;
    const blue=(p.b>p.r+9)&&(p.b>=p.g-7)&&saturation>18&&l<paper+8;

    if(black||blue){
      ink++;
      if(l<paper-42||(blue&&saturation>34))strong++;
    }
  }

  return (ink/inner.length)*.78+(strong/inner.length)*.22;
}

function locateAnswerCenters(warped){
  const L=CONFIG.layout;
  const gray=new cv.Mat();
  const blur=new cv.Mat();
  const bin=new cv.Mat();
  const contours=new cv.MatVector();
  const hierarchy=new cv.Mat();

  try{
    cv.cvtColor(warped,gray,cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray,blur,new cv.Size(3,3),0);
    cv.adaptiveThreshold(
      blur,bin,255,
      cv.ADAPTIVE_THRESH_GAUSSIAN_C,
      cv.THRESH_BINARY_INV,
      31,9
    );
    cv.findContours(bin,contours,hierarchy,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);

    const found=[];
    for(let i=0;i<contours.size();i++){
      const contour=contours.get(i);
      const rect=cv.boundingRect(contour);
      const area=cv.contourArea(contour);
      const ratio=rect.width/Math.max(1,rect.height);
      const diameter=(rect.width+rect.height)/2;
      const cx=rect.x+rect.width/2;
      const cy=rect.y+rect.height/2;

      if(
        ratio>.72 && ratio<1.38 &&
        diameter>L.bubbleRadius*1.15 &&
        diameter<L.bubbleRadius*3.1 &&
        area>120 &&
        cy>L.gridTop-L.rowHeight*.8 &&
        cy<L.gridTop+L.rowHeight*7.8
      ){
        found.push({x:cx,y:cy,d:diameter});
      }
      contour.delete();
    }

    // Match detected circles to the expected 8x2x4 grid.
    const centers=[];
    for(let index=0;index<L.rows;index++){
      const column=index<8?0:1;
      const row=index<8?index:index-8;
      const baseX=L.gridLefts[column];
      const expectedY=L.gridTop+row*L.rowHeight;
      const rowCenters=[];

      for(const offset of L.bubbleXOffsets){
        const expectedX=baseX+offset;
        let best=null,bestDist=Infinity;
        for(const candidate of found){
          const dx=candidate.x-expectedX;
          const dy=candidate.y-expectedY;
          const dist=Math.hypot(dx,dy);
          if(dist<bestDist && Math.abs(dy)<L.rowHeight*.38 && Math.abs(dx)<L.rowHeight*.75){
            best=candidate;
            bestDist=dist;
          }
        }
        rowCenters.push(best?{x:best.x,y:best.y}:{x:expectedX,y:expectedY});
      }
      centers.push(rowCenters);
    }
    return centers;
  }finally{
    gray.delete();blur.delete();bin.delete();contours.delete();hierarchy.delete();
  }
}

function readAnswers(warped){
  const L=CONFIG.layout;
  const centers=locateAnswerCenters(warped);
  let code="";
  let unclear=false;
  const rows=[];

  for(let index=0;index<L.rows;index++){
    const scores=centers[index].map(center=>bubbleScore(
      warped,center.x,center.y,L.bubbleRadius
    ));

    const order=[0,1,2,3].sort((a,b)=>scores[b]-scores[a]);
    const best=order[0];
    const gap=scores[best]-scores[order[1]];

    code+="ABCD"[best];
    rows.push({
      row:index+1,
      best:"ABCD"[best],
      score:scores[best],
      gap,
      centers:centers[index]
    });

    if(scores[best]<.045 || gap<.015)unclear=true;
  }

  return {code,unclear,rows};
}

function groupLabel(name){
  if(name==="groep1")return "Groep 1";
  if(name==="groep2")return "Groep 2";
  if(name==="groep3")return "Groep 3";
  return "testkaart";
}

function decodePhoto(){
  if(!photoLoaded){
    setStatus("Neem eerst een foto.","bad");
    return;
  }
  if(!cvReady){
    setStatus("Beeldverwerking is nog niet klaar.","bad");
    return;
  }

  ui.solution.classList.add("hidden");
  setStatus("Foto wordt gedecodeerd…");
  setDiagnostic(["✓ Foto geladen","… Hoekmarkeringen zoeken"]);

  let src=null,warped=null;
  try{
    src=cv.imread(ui.canvas);

    const markers=detectRegistrationMarkers(src);
    if(!markers){
      setStatus("Vier hoekmarkeringen niet gevonden.","bad");
      setDiagnostic([
        "✓ Foto geladen",
        "✗ Hoekmarkeringen: niet alle vier gevonden",
        "Neem de foto iets rechter, zorg dat de volledige kaart zichtbaar is en vermijd schaduw over de zwarte hoekblokken."
      ]);
      return;
    }

    setDiagnostic(["✓ Foto geladen","✓ Hoekmarkeringen: 4/4","… Perspectief corrigeren"]);
    warped=warpCard(src,markers);

    const card=detectCardType(warped);
    if(!card){
      setStatus("Kaarttype kon niet worden herkend.","bad");
      setDiagnostic([
        "✓ Foto geladen",
        "✓ Hoekmarkeringen: 4/4",
        "✓ Perspectiefcorrectie",
        "✗ Kaarttype"
      ]);
      return;
    }

    const label=groupLabel(card.name);
    setStatus("Herkend: "+label);
    setDiagnostic([
      "✓ Foto geladen",
      "✓ Hoekmarkeringen: 4/4",
      "✓ Perspectiefcorrectie",
      "✓ Kaart: "+label,
      "… Bolletjes analyseren"
    ]);

    const answers=readAnswers(warped);
    const recognizable=answers.rows.filter(row=>row.score>=.05).length;

    if(card.name==="test"){
      setStatus("Herkend: testkaart","ok");
      ui.details.textContent="Herkende reeks: "+answers.code+"\nHerkenbare ingevulde rijen: "+recognizable+" van 16.";
      setDiagnostic([
        "✓ Foto geladen",
        "✓ Hoekmarkeringen: 4/4",
        "✓ Perspectiefcorrectie",
        "✓ Kaart: testkaart",
        "✓ Bolletjes gelokaliseerd en onderzocht: 16",
        "Herkenbare invullingen: "+recognizable
      ]);
      return;
    }

    if(answers.unclear){
      setStatus("Herkend: "+label+"\nScan niet duidelijk genoeg.","bad");
      ui.details.textContent="Herkende reeks: "+answers.code+"\nEén of meer bolletjes zijn te licht of meerdere bolletjes lijken gelijk ingevuld.";
      setDiagnostic([
        "✓ Foto geladen",
        "✓ Hoekmarkeringen: 4/4",
        "✓ Perspectiefcorrectie",
        "✓ Kaart: "+label,
        "✓ Bolletjes gelokaliseerd en onderzocht: 16",
        "✗ Minstens één rij is onduidelijk"
      ]);
      return;
    }

    const expected=CONFIG.game.groups[card.name].answers;
    const errors=[...answers.code].filter((value,index)=>value!==expected[index]).length;

    setStatus("Herkend: "+label+"\nAantal fouten: "+errors,errors===0?"ok":"bad");
    ui.details.textContent=
      "Herkende reeks: "+answers.code+"\n"+
      (errors===0
        ?"Correct gedecodeerd. De oplossing verschijnt hieronder."
        :"Verbeter de antwoorden en scan opnieuw.");

    setDiagnostic([
      "✓ Foto geladen",
      "✓ Hoekmarkeringen: 4/4",
      "✓ Perspectiefcorrectie",
      "✓ Kaart: "+label,
      "✓ Bolletjes gelokaliseerd en onderzocht: 16",
      "✓ Decodering voltooid",
      "Herkende reeks: "+answers.code
    ]);

    if(errors===0){
      const solutionSource=CONFIG.game.groups[card.name].solution;
      ui.solution.classList.add("hidden");
      ui.solution.removeAttribute("src");
      requestAnimationFrame(()=>{
        ui.solution.src=solutionSource;
        setTimeout(()=>ui.solution.scrollIntoView({behavior:"smooth",block:"start"}),120);
      });
    }
  }catch(error){
    console.error(error);
    setStatus("Technische fout tijdens het decoderen.","bad");
    setDiagnostic([
      "✗ Technische fout",
      String(error?.message||error),
      error?.stack ? error.stack.split("\n").slice(0,3).join("\n") : ""
    ]);
  }finally{
    if(src)src.delete();
    if(warped)warped.delete();
  }
}

ui.decodeBtn.addEventListener("click",decodePhoto);
document.addEventListener("DOMContentLoaded",()=>{
  setStatus("Beeldverwerking wordt geladen…");
});
</script>
